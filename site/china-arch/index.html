<!doctype html><html lang="zh-CN"><meta charset="utf-8">

<body>
<canvas id="mapc" width="1920" height="1080"></canvas>

<div class="top" id="top"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js'; window.THREE = THREE;
const EP = +(new URLSearchParams(location.search).get('ep') || 1);
const load = f => new Promise((res, rej) => { const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
for (const f of [`tl_e${EP}.js`, 'data.js', 'geomap.js', 'lib.js', `s${EP}.js`]) await load(f);
window.MAPREADY = MAPINIT();
await load('engine.js'); await load('../_shared/player.js');
</script>
