<title>月球拖船 · MV</title>
<style>html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}canvas{position:absolute;left:0;top:0}#gl{visibility:hidden}</style>
<body><canvas id="gl" width="1920" height="1080"></canvas><canvas id="out" width="1920" height="1080"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js';
// ---------------- 基础 ----------------
const BPM = 70, BAR = 240 / BPM, BEAT = 60 / BPM, NB = 53, TOTAL = NB * BAR + 4;

const cv = document.getElementById('gl'), r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });

const lightsT = (() => { const im = dayT.image, c = mk(4096, 2048), g = c.getContext('2d'); g.drawImage(im, 0, 0, 4096, 2048); const d = g.getImageData(0, 0, 4096, 2048).data, oc = mk(4096, 2048), og = oc.getContext('2d'); og.fillStyle = '#000'; og.fillRect(0, 0, 4096, 2048);
  srand(3); const land = (x, y) => { const i = ((y | 0) * 4096 + (x | 0)) * 4, R = d[i], G = d[i + 1], B = d[i + 2]; return B < R + 25 && !(R > 200 && G > 200 && B > 200) && y > 250 && y < 1800; };
  const cities = []; for (let k = 0; k < 2600; k++) { const x = rnd() * 4096, y = 300 + rnd() * 1400; if (land(x, y)) cities.push([x, y, rnd()]); }

const earthMat = new THREE.ShaderMaterial({ uniforms: { day: { value: dayT }, lights: { value: lightsT }, sd: { value: new THREE.Vector3(1, .2, .6).normalize() }, ice: { value: 0 }, li: { value: 1 }, amb: { value: .02 }, sk: { value: 1 } },
  vertexShader: 'varying vec2 vU; varying vec3 vN; varying vec3 vV; void main(){ vU = uv; vN = normalize((modelMatrix*vec4(normal,0.)).xyz); vec4 w = modelMatrix*vec4(position,1.); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }',

    float l = max(0., dot(vN, sd)); float tw = smoothstep(-.12, .12, dot(vN, sd));

const earth = new THREE.Mesh(new THREE.SphereGeometry(1, 192, 144), earthMat); sc.add(earth);

  vertexShader: 'varying vec3 vN; varying vec3 vV; varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.); vN = normalize((modelMatrix*vec4(normal,0.)).xyz); vV = normalize(cameraPosition - w.xyz); vW = normalize(w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }',
  fragmentShader: 'uniform vec3 sd; varying vec3 vN; varying vec3 vV; varying vec3 vW; void main(){ float f = pow(1. - abs(dot(vN, vV)), 4.); float lit = smoothstep(-.3, .35, dot(vW, sd)); gl_FragColor = vec4(mix(vec3(.85,.4,.2), vec3(.35,.6,1.), lit)*f*2.4*(.12+lit), f); }' });

  for (let i = 0; i < N; i++) { const ph = i / N * Math.PI * 2, tilt = .62, base = new THREE.Vector3(Math.cos(ph) * Math.sin(tilt), Math.sin(ph) * Math.sin(tilt), Math.cos(tilt));

      vertexShader: 'varying vec2 vU; varying vec3 vN; varying vec3 vV; void main(){ vU = uv; vec4 w = modelMatrix*vec4(position,1.); vN = normalize((modelMatrix*vec4(normal,0.)).xyz); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix*viewMatrix*w; }',
      fragmentShader: 'uniform float k, t, s; varying vec2 vU; varying vec3 vN; varying vec3 vV; void main(){ float e = pow(abs(dot(vN, vV)), 1.5); float fl = .85 + .15 * sin(t * 23. + s + vU.y * 30.) * sin(t * 7. + s * 3.); float y = vU.y; float a = pow(y, 2.8) * .3 * e * fl * k; gl_FragColor = vec4(vec3(.5,.72,1.) * a + vec3(.9,.95,1.) * pow(y, 20.) * .6 * k, 1.); }' });
    const j = new THREE.Mesh(g, mat); j.position.copy(MPOS).add(base.clone().multiplyScalar(MR * .96)); j.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), base); sc.add(j); JETS.push(mat); } }
const setJets = (f, t) => JETS.forEach((m, i) => { m.uniforms.k.value = typeof f === 'function' ? f(i) : f; m.uniforms.t.value = t; });
const starPts = (() => { srand(19); const n = 6000, P = new Float32Array(n * 3), C = new Float32Array(n * 3); for (let i = 0; i < n; i++) { const u = rnd() * 2 - 1, t = rnd() * 6.283, R = 4000, b = .35 + .65 * Math.pow(rnd(), 3); P[i * 3] = R * Math.sqrt(1 - u * u) * Math.cos(t); P[i * 3 + 1] = R * Math.sqrt(1 - u * u) * Math.sin(t); P[i * 3 + 2] = R * u; C[i * 3] = b * .85; C[i * 3 + 1] = b * .9; C[i * 3 + 2] = b; }

const sunSprite = (() => { const c = mk(256, 256), g = c.getContext('2d'), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,250,235,1)'); gr.addColorStop(.08, 'rgba(255,235,200,.9)'); gr.addColorStop(.3, 'rgba(255,190,120,.15)'); gr.addColorStop(1, 'rgba(255,160,80,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256);

function setSun(dir, ice = 0, li = 1, amb = .02, sk = 1) { earthMat.uniforms.sk.value = sk; const d = dir.clone().normalize(); earthMat.uniforms.sd.value.copy(d); sunL.position.copy(d.clone().multiplyScalar(50)); earthMat.uniforms.ice.value = ice; earthMat.uniforms.li.value = li; earthMat.uniforms.amb.value = amb; }
function render3(pos, look, fov = 40, up = [0, 1, 0]) { cam.fov = fov; cam.updateProjectionMatrix(); cam.position.set(...pos); cam.up.set(...up); cam.lookAt(...look); r.render(sc, cam); return cv; }
// ---------------- 调色与字幕 ----------------
const small = mk(480, 270), sg2 = small.getContext('2d');
const grainT = Array.from({ length: 6 }, (_, k) => { const c = mk(512, 512), g = c.getContext('2d'), im = g.createImageData(512, 512); srand(100 + k); for (let i = 0; i < im.data.length; i += 4) { const v = 128 + (rnd() - .5) * 90; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } g.putImageData(im, 0, 0); return o.createPattern(c, 'repeat'); });
function grade(fr, bloom = .5) {
  o.globalCompositeOperation = 'source-over'; o.globalAlpha = 1; o.filter = 'none';
  sg2.clearRect(0, 0, 480, 270); sg2.filter = 'blur(6px)'; sg2.drawImage(out, 0, 0, 480, 270); sg2.filter = 'none';
  o.globalCompositeOperation = 'lighter'; o.globalAlpha = bloom; o.drawImage(small, 0, 0, W, H); o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';
  const g = o.createRadialGradient(960, 540, 320, 960, 540, 1180); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.6)'); o.fillStyle = g; o.fillRect(0, 0, W, H);
  o.globalCompositeOperation = 'overlay'; o.globalAlpha = .16; o.fillStyle = grainT[fr % 6]; o.save(); o.translate((fr * 37) % 512, (fr * 91) % 512); o.fillRect(-512, -512, W + 1024, H + 1024); o.restore(); o.globalAlpha = 1; o.globalCompositeOperation = 'source-over';
  if (!window.NOLB) { o.fillStyle = '#000'; o.fillRect(0, 0, W, LB); o.fillRect(0, H - LB, W, LB); }
}
function caption(a, main, sub, pos = 'bl') {
  if (a <= 0) return; o.globalAlpha = a; o.textBaseline = 'alphabetic';
  const x = pos === 'c' ? W / 2 : pos === 'br' ? W - 130 : 130, y = pos === 'c' ? H / 2 : H - LB - 64; o.textAlign = pos === 'c' ? 'center' : pos === 'br' ? 'right' : 'left';
  o.fillStyle = 'rgba(242,230,204,.95)'; o.font = `600 ${pos === 'c' ? 60 : 46}px ${SERIF}`; o.shadowColor = 'rgba(0,0,0,.8)'; o.shadowBlur = 18; o.fillText(main, x, y - (pos === 'c' && sub ? 20 : 0));
  if (sub) { o.fillStyle = 'rgba(205,195,175,.75)'; o.font = `400 ${pos === 'c' ? 26 : 22}px ${SANS}`; o.letterSpacing = '5px'; o.fillText(sub, x, y + (pos === 'c' ? 40 : 40)); o.letterSpacing = '0px'; }
  o.shadowBlur = 0; o.globalAlpha = 1; o.textAlign = 'left';
}
// ---------------- 2D 小工具 ----------------
const moonDisc = (() => { const c = mk(512, 512), g = c.getContext('2d'); g.beginPath(); g.arc(256, 256, 256, 0, 7); g.clip(); g.drawImage(moonT.image, 600, 200, 600, 600, 0, 0, 512, 512);
  const sh = g.createRadialGradient(330, 200, 60, 256, 256, 300); sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = sh; g.fillRect(0, 0, 512, 512); return c; })();
function drawMoon(g, x, y, rr, halo = 1, t = 0) {
  if (halo > 0) { for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283 + .1, L = rr * (2.2 + .5 * Math.abs(Math.sin(i * 2.3))) * (1 + .04 * Math.sin(t * 9 + i)); const gr = g.createLinearGradient(x + Math.cos(a) * rr, y + Math.sin(a) * rr, x + Math.cos(a) * (rr + L), y + Math.sin(a) * (rr + L));
      gr.addColorStop(0, `rgba(170,205,255,${.2 * halo})`); gr.addColorStop(1, 'rgba(120,170,255,0)'); g.strokeStyle = gr; g.lineWidth = rr * .09; g.lineCap = 'round'; g.beginPath(); g.moveTo(x + Math.cos(a) * rr * .9, y + Math.sin(a) * rr * .9); g.lineTo(x + Math.cos(a) * (rr + L), y + Math.sin(a) * (rr + L)); g.stroke(); }
    const hg = g.createRadialGradient(x, y, rr, x, y, rr * 3.4); hg.addColorStop(0, `rgba(150,190,255,${.16 * halo})`); hg.addColorStop(1, 'rgba(150,190,255,0)'); g.fillStyle = hg; g.beginPath(); g.arc(x, y, rr * 3.4, 0, 7); g.fill(); }

function skyGrad(g, top, bot, y0 = 0, y1 = H) { const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, top); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
const HILLS = R0(64, 31), CITY = R0(140, 41), ICE = R0(80, 51);
// ---------------- 镜头 ----------------
const B = x => x * BAR;
const S = [];
const shot = (a, b, f, opt = {}) => S.push({ a: B(a), b: B(b), f, ...opt });
// 1 星空与题词
shot(0, 2.6, (g, t) => { g.fillStyle = '#000'; g.fillRect(0, 0, W, H); stars2d(g, ss(t / 4), t * 4, 0, t); });
// 2 地面：夜里的人与月亮
shot(2.4, 4.0, (g, t, u) => { const pan = 140 * ss(u); skyGrad(g, '#050913', '#16243b'); stars2d(g, .9, t * 3, pan * .3, t);

  g.fillStyle = '#04060b'; g.beginPath(); g.moveTo(0, H); for (let i = 0; i <= 60; i++) { const x = i / 60 * W; g.lineTo(x, 700 + 50 * Math.sin(i * .5) + 40 * HILLS[i][0]); } g.lineTo(W, H); g.fill();
