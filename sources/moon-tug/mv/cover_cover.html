<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden;color:#f2e6cc}
#bg{position:absolute;inset:0;background-size:cover;background-position:center}
.t{position:absolute;right:7%;top:50%;transform:translateY(-50%);text-align:right}
.k{font:600 30px "Noto Sans CJK SC";letter-spacing:.5em;color:rgba(242,196,107,.9);margin-bottom:24px}
h1{margin:0;font:900 150px/1.05 "Noto Serif CJK SC",serif;letter-spacing:.08em;text-shadow:0 6px 40px #000}
.s{margin-top:28px;font:500 30px "Noto Sans CJK SC";letter-spacing:.3em;color:rgba(220,210,190,.85)}
.v .t{right:0;left:0;top:auto;bottom:9%;transform:none;text-align:center}.v h1{font-size:150px}.v .s{font-size:32px}
.r43 .t{right:6%}.r43 h1{font-size:130px}
</style><body><div id="bg"></div><div class="t"><div class="k">音乐短片</div><h1>月球拖船</h1><div class="s">THE MOON TUG</div></div>
<script>const W = innerWidth, H = innerHeight; const v = H > W, r43 = !v && W / H < 1.5; if (v) document.body.classList.add('v'); if (r43) document.body.classList.add('r43');
bg.style.backgroundImage = `url(${v ? 'bg916.png' : r43 ? 'bg43.png' : 'bg_tug.png'})`; const im = new Image(); im.onload = () => window.ready = true; im.src = v ? 'bg916.png' : r43 ? 'bg43.png' : 'bg_tug.png';</script></body></html>
