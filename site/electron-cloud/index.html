<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js'; window.THREE = THREE;
const EP = +(new URLSearchParams(location.search).get('ep') || 1);
for (const f of [`tl_e${EP}.js`, 'ec.js', 'mol.js', 'iso.js', 'lib.js', `s${EP}.js`, 'engine.js', '../_shared/player.js']) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = f; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
</script>
