<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
body{margin:0;background:#F2F3EF;font-family:"Inter","Noto Sans CJK SC",sans-serif;color:#11161C;overflow:hidden;position:relative}
.ep{display:inline-block;font:700 34px sans-serif;background:#11161C;color:#fff;padding:10px 22px;border-radius:10px}
h1{font:900 170px/1.05 "Noto Serif CJK SC",serif;margin:24px 0 0;white-space:nowrap}
.st{font:700 60px/1.3 "Noto Serif CJK SC",serif;color:#3D4650;margin-top:10px}
.badge{margin-top:36px;display:inline-block;border:3px solid #5B4A9E;color:#5B4A9E;border-radius:12px;padding:10px 20px;font-size:28px;font-weight:700}
img{border-radius:20px;box-shadow:0 20px 60px rgba(30,30,20,.15);display:block}
.L,.R{position:absolute}
</style><body><div class="L" id="L"><span class="ep" id="ep"></span><h1 id="h1"></h1><div class="st" id="st"></div><div class="badge" id="bd"></div></div><div class="R" id="R"></div>
<script>
const q = new URLSearchParams(location.search), ep = +(q.get('ep') || 1), ar = q.get('ar') || '169';
const TITLE = '方解石', E = { 1: ['上集', '从原子到双像', '电子云 · 晶体结构 · 双折射'], 2: ['下集', '力、热与化学', '解理 · 孪晶 · 热膨胀 · 光谱'] }[ep];
const $ = id => document.getElementById(id);
$('ep').textContent = E[0]; $('h1').textContent = TITLE; $('st').textContent = E[1]; $('bd').textContent = E[2];
const W = { '169': [1920, 1080], '43': [1440, 1080], '916': [1080, 1920] }[ar];
document.body.style.width = W[0] + 'px'; document.body.style.height = W[1] + 'px';
const L = $('L').style, R = $('R');
if (ar === '169') { L.left = '170px'; L.top = '250px'; R.style.cssText = 'left:1000px;top:200px'; R.innerHTML = `<img src="c${ep}.png" style="width:760px">`; }
else if (ar === '43') { L.left = '110px'; L.top = '120px'; R.style.cssText = 'left:610px;top:330px'; R.innerHTML = `<img src="c${ep}.png" style="width:720px">`; $('h1').style.fontSize = '150px'; }
else { L.left = '110px'; L.top = '170px'; R.style.cssText = 'left:50px;top:800px'; R.innerHTML = `<img src="c${ep}.png" style="width:980px"><div style="margin-top:70px;text-align:center;font:700 44px 'Noto Serif CJK SC',serif;color:#3D4650">从原子与电子云看矿物的性质</div>`; $('h1').style.fontSize = '190px'; $('st').style.fontSize = '70px'; }
</script></body></html>
