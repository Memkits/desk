<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
html,body{margin:0;background:#070A12;overflow:hidden;font-family:"Noto Sans CJK SC",sans-serif;color:#fff}
canvas{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,18,.93) 0,rgba(7,10,18,.6) 45%,rgba(7,10,18,0) 70%)}
.v .shade{background:linear-gradient(180deg,rgba(7,10,18,.94) 0,rgba(7,10,18,.6) 48%,rgba(7,10,18,0) 66%)}
.t{position:absolute;left:7%;top:12%;max-width:62%}
.v .t{left:8%;right:8%;top:6%;max-width:none}
.k{display:inline-block;font:700 40px "Noto Sans CJK SC";color:#0b0f18;background:#FFD27A;padding:8px 22px;border-radius:12px}
.name{font:900 116px/1.15 "Noto Serif CJK SC",serif;margin-top:28px;text-shadow:0 6px 30px #000}
.name span{color:#C79BFF}
.sub{font:600 36px/1.55 "Noto Sans CJK SC";margin-top:26px;color:#FFD27A;text-shadow:0 2px 12px #000}
.v .name{font-size:104px}.v .sub{font-size:42px}.v .k{font-size:46px}
.r43 .t{max-width:90%}.r43 .name{font-size:100px}.r43 .sub{font-size:32px}
</style>
<body><canvas id="c"></canvas><div class="shade"></div>
<div class="t"><div class="k">新闻解读 · 2026 年 11 月</div><div class="name">AI <span>智能体</span><br>进驻虚幻引擎</div><div class="sub" id="sub"></div></div>
<script>
const W = innerWidth, H = innerHeight, V = H > W, R43 = !V && W / H < 1.5;
if (V) document.body.classList.add('v'); if (R43) document.body.classList.add('r43');
sub.innerHTML = ['一周做出的 5.9 预览版', 'MCP 实测', '虚幻引擎 6 去掉蓝图'].map((x, i, a) => `<span style="white-space:nowrap">${x}${i < a.length - 1 ? ' ·' : ''}</span>`).join(' ');
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const HS = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
g.fillStyle = '#05070F'; g.fillRect(0, 0, W, H);
const neb = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
const S = Math.min(W, H), cx = W * (V ? .5 : R43 ? .74 : .72), cy = H * (V ? .74 : R43 ? .68 : .55);
neb(cx, cy, S * .8, 'rgba(199,155,255,.28)'); neb(cx - S * .3, cy + S * .2, S * .5, 'rgba(92,180,255,.18)');
for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(200,215,255,${.05 + HS(i, 5) * .35})`; g.beginPath(); g.arc(HS(i, 1) * W, HS(i, 2) * H, .6 + HS(i, 3) * 1.6, 0, 7); g.fill(); }
// 透视地面网格
g.strokeStyle = 'rgba(92,180,255,.35)'; g.lineWidth = 2; const hy = cy - S * .05, by = H;
for (let i = -12; i <= 12; i++) { g.beginPath(); g.moveTo(cx + i * S * .04, hy); g.lineTo(cx + i * S * .3, by); g.stroke(); }
for (let j = 0; j < 12; j++) { const y = hy + (by - hy) * (j / 11) ** 1.8; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
// 方块（关卡）
const cube = (x, y, s, c) => { g.save(); g.shadowColor = c; g.shadowBlur = 20; g.fillStyle = c + '55'; g.strokeStyle = c; g.lineWidth = 3; g.beginPath(); g.moveTo(x, y - s * .5); g.lineTo(x + s * .6, y - s * .2); g.lineTo(x + s * .6, y + s * .45); g.lineTo(x, y + s * .75); g.lineTo(x - s * .6, y + s * .45); g.lineTo(x - s * .6, y - s * .2); g.closePath(); g.fill(); g.stroke(); g.beginPath(); g.moveTo(x - s * .6, y - s * .2); g.lineTo(x, y + s * .1); g.lineTo(x + s * .6, y - s * .2); g.moveTo(x, y + s * .1); g.lineTo(x, y + s * .75); g.stroke(); g.restore(); };
const bot = (x, y, s, c) => { g.save(); g.shadowColor = c; g.shadowBlur = 30; g.fillStyle = c; g.beginPath(); g.roundRect(x - 18 * s, y - 22 * s, 36 * s, 30 * s, 8 * s); g.fill(); g.beginPath(); g.roundRect(x - 14 * s, y + 12 * s, 28 * s, 16 * s, 5 * s); g.fill(); g.shadowBlur = 0; g.fillStyle = '#0B1020'; g.beginPath(); g.arc(x - 7 * s, y - 8 * s, 4 * s, 0, 7); g.arc(x + 7 * s, y - 8 * s, 4 * s, 0, 7); g.fill(); g.strokeStyle = c; g.lineWidth = 3 * s / 2; g.beginPath(); g.moveTo(x, y - 22 * s); g.lineTo(x, y - 30 * s); g.stroke(); g.fillStyle = c; g.beginPath(); g.arc(x, y - 32 * s, 4 * s, 0, 7); g.fill(); g.restore(); };
const s0 = S * .12;
[[-1.4, .5, '#5CB4FF'], [0, .2, '#5FE0A0'], [1.4, .5, '#FFB25C'], [-.7, 1.1, '#5FE0A0'], [.7, 1.1, '#5CB4FF']].forEach(([dx, dy, c]) => cube(cx + dx * s0, cy + dy * s0, s0 * .8, c));
bot(cx, cy - s0 * 1.4, S / 260, '#C79BFF');
[[-2.3, -1.2, '#5CB4FF'], [2.3, -1.0, '#5FE0A0']].forEach(([dx, dy, c]) => bot(cx + dx * s0, cy + dy * s0, S / 520, c));
document.fonts.ready.then(() => window.ready = true);
</script></body></html>
