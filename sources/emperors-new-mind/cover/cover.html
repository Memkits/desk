<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
html,body{margin:0;background:#070A12;overflow:hidden;font-family:"Noto Sans CJK SC",sans-serif;color:#fff}
canvas{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,18,.92) 0,rgba(7,10,18,.55) 45%,rgba(7,10,18,0) 72%)}
.v .shade{background:linear-gradient(180deg,rgba(7,10,18,.94) 0,rgba(7,10,18,.6) 45%,rgba(7,10,18,0) 68%)}
.t{position:absolute;left:7%;top:11%;max-width:60%}
.v .t{left:8%;right:8%;top:6%;max-width:none}
.series{font:900 112px/1.1 "Noto Serif CJK SC",serif;text-shadow:0 6px 30px #000}
.ep{display:inline-block;margin-top:30px;font:700 40px "Noto Sans CJK SC";color:#0b0f18;padding:8px 22px;border-radius:12px}
.name{font:900 120px/1.15 "Noto Serif CJK SC",serif;margin-top:22px;text-shadow:0 6px 30px #000}
.sub{font:600 34px/1.5 "Noto Sans CJK SC";margin-top:22px;text-shadow:0 2px 12px #000}
.v .series{font-size:104px}.v .name{font-size:94px}.v .sub{font-size:42px}.v .ep{font-size:48px}
.r43 .t{max-width:88%} .r43 .series{font-size:100px}
</style>
<body><canvas id="c"></canvas><div class="shade"></div>
<div class="t"><div class="series">皇帝新脑<span style="font-size:.5em;margin-left:.4em;color:#FFD27A">导读</span></div><div class="ep" id="ep"></div><div class="name" id="nm"></div><div class="sub" id="sub"></div></div>
<script>
const q = new URLSearchParams(location.search), EP = +q.get('ep') || 0, W = innerWidth, H = innerHeight, V = H > W, R43 = !V && W / H < 1.5;
if (V) document.body.classList.add('v'); if (R43) document.body.classList.add('r43');
const E = { 0: ['四集导读', '', '图灵机 · 哥德尔 · 曼德布罗集 · 量子力学 · 时间之箭 · 量子引力 · 意识', '#FFD27A'],
  1: ['第一集', '电脑能有心灵吗', '图灵测试 · 中文屋 · 图灵机 · 停机问题', '#5CB4FF'],
  2: ['第二集', '数学是发现还是发明', '曼德布罗集 · 哥德尔定理 · 铺砖问题', '#C79BFF'],
  3: ['第三集', '经典世界与量子之谜', '混沌 · 相对论 · 双缝 · 薛定谔的猫', '#FFD27A'],
  4: ['第四集', '心灵的物理在哪里', '时间之箭 · 引力坍缩 · 大脑 · 意识', '#5FE0A0'] }[EP];
ep.textContent = E[0]; ep.style.background = E[3]; nm.textContent = E[1]; if (!E[1]) { nm.style.display = 'none'; sub.style.fontSize = V ? '44px' : '42px'; sub.style.marginTop = '40px'; sub.style.maxWidth = V ? 'none' : '62%'; } sub.style.color = E[3];
sub.innerHTML = E[2].split(' · ').map((x, i, a) => `<span style="white-space:nowrap">${x}${i < a.length - 1 ? ' ·' : ''}</span>`).join(' ');
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const HS = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
g.fillStyle = '#05070F'; g.fillRect(0, 0, W, H);
const neb = (x, y, r, c) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, c); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H); };
const cx = W * (V ? .5 : R43 ? .8 : .73), cy = H * (V ? .7 : .52), S = Math.min(W, H), col = E[3];
neb(cx, cy, S * .8, col + '44');
// 背景：星点
for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(200,215,255,${.05 + HS(i, 5) * .35})`; g.beginPath(); g.arc(HS(i, 1) * W, HS(i, 2) * H, .6 + HS(i, 3) * 1.6, 0, 7); g.fill(); }
const big = (s, x, y, fs, c) => { g.save(); g.font = `900 ${fs}px "DejaVu Serif","Noto Serif CJK SC"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 40; g.fillText(s, x, y); g.restore(); };
const brain = (x, y, r, c) => { g.save(); g.translate(x, y); g.strokeStyle = c; g.fillStyle = c + '22'; g.lineWidth = Math.max(3, r * .025); g.shadowColor = c; g.shadowBlur = 25; g.beginPath(); g.ellipse(0, 0, r, r * .72, 0, 0, 7); g.fill(); g.stroke(); g.lineWidth = Math.max(2, r * .015); for (let i = 0; i < 7; i++) { g.beginPath(); const yy = -r * .55 + i * r * .18; let st = false; for (let k = 0; k <= 30; k++) { const xx = -r * .85 + k * r * .057, v = yy + Math.sin(k * .9 + i * 1.7) * r * .05; if (Math.hypot(xx / r, v / (r * .7)) > .95) { st = false; continue; } st ? g.lineTo(xx, v) : g.moveTo(xx, v); st = true; } g.stroke(); } g.setLineDash([8, 8]); g.beginPath(); g.moveTo(0, -r * .72); g.lineTo(0, r * .7); g.stroke(); g.restore(); };
const crown = (x, y, s, c) => { g.save(); g.translate(x, y); g.strokeStyle = c; g.lineWidth = s * .05; g.shadowColor = c; g.shadowBlur = 30; g.lineJoin = 'round'; g.beginPath(); g.moveTo(-s, s * .2); g.lineTo(-s, -s * .6); g.lineTo(-s * .5, -s * .15); g.lineTo(0, -s * .8); g.lineTo(s * .5, -s * .15); g.lineTo(s, -s * .6); g.lineTo(s, s * .2); g.closePath(); g.stroke(); g.restore(); };
if (EP === 1) { brain(cx - S * .05, cy + S * .05, S * .25, '#C79BFF'); const n = 7, cw = S * .075, x0 = Math.min(cx - n * cw / 2, W - n * cw - 30), y0 = cy + S * .33; g.font = `800 ${cw * .5}px "DejaVu Sans Mono"`; g.textAlign = 'center'; g.textBaseline = 'middle'; for (let i = 0; i < n; i++) { g.strokeStyle = i === 3 ? '#FFD27A' : 'rgba(92,180,255,.7)'; g.lineWidth = 3; g.strokeRect(x0 + i * cw, y0, cw * .9, cw * .9); g.fillStyle = '#E9EEF7'; g.fillText('1011010'[i], x0 + i * cw + cw * .45, y0 + cw * .45); } big('?', Math.min(cx + S * .3, W - S * .1), cy - S * .25, S * .28, '#5CB4FF'); }
else if (EP === 2) { const w = Math.round(S * .78), h = Math.round(S * .6), x0 = Math.round(W - w - S * .02), y0 = Math.round(H - h - S * .03); const im = g.createImageData(w, h); for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) { const a = -2.1 + px / w * 2.8, b = (py / h - .5) * 2.2; let x = 0, y = 0, i = 0; while (x * x + y * y < 16 && i < 120) { const t = x * x - y * y + a; y = 2 * x * y + b; x = t; i++; } const o = (py * w + px) * 4; if (i < 120) { const q = Math.max(0, Math.min(1, (Math.sqrt(i / 120) * 1.6 - .3) / .7)); im.data[o] = 60 + 170 * q; im.data[o + 1] = 40 + 110 * q; im.data[o + 2] = 120 + 135 * q; im.data[o + 3] = 255 * q; } else { im.data[o + 3] = 255; } } g.putImageData(im, x0, y0); }
else if (EP === 3) { for (let x = 0; x < W; x += 3) { const d = (x - cx) / (S * .5), v = Math.cos(d * 9) ** 2 * Math.exp(-d * d * 1.2); g.fillStyle = `rgba(255,210,122,${.55 * v})`; g.fillRect(x, 0, 3, H); } const r = S * .2, sx = Math.min(cx + S * .05, W - r - 40), sy = cy + S * .15; g.save(); g.strokeStyle = 'rgba(92,180,255,.9)'; g.lineWidth = 3; g.shadowColor = '#5CB4FF'; g.shadowBlur = 20; g.beginPath(); g.arc(sx, sy, r, 0, 7); g.stroke(); for (let k = -2; k <= 2; k++) { const yy = sy + r * k / 3, w = Math.sqrt(1 - (k / 3) ** 2) * r; g.beginPath(); g.ellipse(sx, yy, w, w * .25, 0, 0, 7); g.stroke(); } g.restore(); }
else if (EP === 4) { brain(cx, cy + S * .08, S * .26, '#5FE0A0'); for (let i = 0; i < 60; i++) { const a = HS(i, 9) * 7, rr = S * (.3 + HS(i, 8) * .2); g.fillStyle = 'rgba(255,210,122,.6)'; g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + S * .08 + Math.sin(a) * rr * .7, 2 + HS(i, 7) * 3, 0, 7); g.fill(); } big('ħ/E', Math.min(cx + S * .32, W - S * .14), cy - S * .3, S * .12, '#FFD27A'); }
else { brain(cx, cy + S * .1, S * .24, '#C79BFF'); crown(cx, cy - S * .25, S * .17, '#FFD27A'); }
document.fonts.ready.then(() => window.ready = true);
</script></body></html>
