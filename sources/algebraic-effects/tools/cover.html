<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>
body{margin:0;width:1920px;height:1080px;background:#F2F3EF;font-family:"Inter","Noto Sans CJK SC",sans-serif;color:#11161C;overflow:hidden;position:relative}
.L{position:absolute;left:250px;top:170px}
.ep{display:inline-block;font:700 34px sans-serif;background:#11161C;color:#fff;padding:10px 22px;border-radius:10px}
h1{font:900 170px/1.05 "Noto Serif CJK SC",serif;margin:24px 0 0;white-space:nowrap}
.st{font:700 60px/1.3 "Noto Serif CJK SC",serif;color:#3D4650;margin-top:10px}
.badge{margin-top:36px;display:inline-block;border:3px solid #5B4A9E;color:#5B4A9E;border-radius:12px;padding:10px 20px;font-size:28px;font-weight:700}
.R{position:absolute;left:1040px;top:480px;width:640px}
.code{font:500 30px/1.55 "DejaVu Sans Mono",monospace;background:#1D2128;color:#E8E6DF;border-radius:18px;padding:26px 32px;white-space:pre}
.code .kw{color:#F0B86E}.code .hl{background:rgba(255,215,90,.2)}.code .k{color:#C9B6FF;font-weight:700}
.t{padding:16px 22px;border-radius:14px;color:#fff;font-size:30px;font-weight:700;margin-bottom:12px}
.t small{display:block;font-size:20px;font-weight:400;opacity:.85}
</style><body>
<div class="L"><span class="ep" id="ep"></span><h1>代数作用</h1><div class="st" id="st"></div><div class="badge" id="bd"></div></div>
<div class="R" id="R"></div>
<script>
const ep=+(new URLSearchParams(location.search).get('ep')||1);
const E={1:['上集','来历与用法','可以恢复的异常'],2:['下集','类型与实现','纤程 · 证据传递 · CPS · WasmFX']}[ep];
document.getElementById('ep').textContent=E[0];document.getElementById('st').textContent=E[1];document.getElementById('bd').textContent=E[2];
const R=document.getElementById('R');
if(ep===1)R.innerHTML=`<div class="code">x = <span class="hl">perform Ask()</span>
…
<span class="kw">handle</span> (Ask, <span class="k">k</span>) {
  <span class="k">k</span>(42)
}</div>`;
else R.innerHTML=[['栈切换','OCaml 5 · Wasm','#1F5FA8'],['证据传递','Koka','#B5651D'],['CPS','编译到 JS','#5B4A9E']].map(([a,s,c],k)=>`<div class="t" style="background:${c};margin-left:${k*60}px;width:440px">${a}<small>${s}</small></div>`).join('');
</script></body></html>
