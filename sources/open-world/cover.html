<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<style>
html,body{margin:0;background:#070A12;overflow:hidden;font-family:"Noto Sans CJK SC",sans-serif;color:#fff}
canvas{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,10,18,.9) 0,rgba(7,10,18,.6) 42%,rgba(7,10,18,0) 72%)}
.v .shade{background:linear-gradient(180deg,rgba(7,10,18,.92) 0,rgba(7,10,18,.6) 42%,rgba(7,10,18,0) 65%)}
.t{position:absolute;left:7%;top:11%;max-width:60%}
.v .t{left:8%;right:8%;top:6%;max-width:none}
.series{font:900 112px/1.1 "Noto Serif CJK SC",serif;text-shadow:0 6px 30px #000}
.ep{display:inline-block;margin-top:30px;font:700 40px "Noto Sans CJK SC";color:#0b0f18;padding:8px 22px;border-radius:12px}
.name{font:900 120px/1.15 "Noto Serif CJK SC",serif;margin-top:22px;text-shadow:0 6px 30px #000}
.sub{font:600 34px/1.5 "Noto Sans CJK SC";margin-top:22px;text-shadow:0 2px 12px #000}
.v .series{font-size:104px}.v .name{font-size:118px}.v .sub{font-size:42px}.v .ep{font-size:48px}
.r43 .t{max-width:88%} .r43 .series{font-size:100px}
</style>
<body><canvas id="c"></canvas><div class="shade"></div>
<div class="t"><div class="series">开放世界<br>是怎么做出来的</div><div class="ep" id="ep"></div><div class="name" id="nm"></div><div class="sub" id="sub"></div></div>
<script>
const q = new URLSearchParams(location.search), EP = +q.get('ep') || 0, W = innerWidth, H = innerHeight, V = H > W, R43 = !V && W / H < 1.5;
if (V) document.body.classList.add('v'); if (R43) document.body.classList.add('r43');
const E = { 0: ['四集专题', '', '装得下 · 画得出 · 造得出 · 活起来', '#FFD27A'],
  1: ['第一集', '装得下', '流式加载 · 大世界坐标 · Nanite · 剔除 · IO', '#5CB4FF'],
  2: ['第二集', '画得出', '地形 · 植被 · Lumen · 天空与云 · 帧预算', '#5FE0A0'],
  3: ['第三集', '造得出', '程序化生成 · PCG · 扫描资产 · 工具与协作', '#FFB25C'],
  4: ['第四集', '活起来', 'NPC · 物理 · 存档 · 多人 · AI 浪潮', '#FF7A93'] }[EP];
ep.textContent = E[0]; ep.style.background = E[3]; nm.textContent = E[1]; if (!E[1]) { nm.style.display = 'none'; sub.style.fontSize = '52px'; sub.style.marginTop = '40px'; } sub.style.color = E[3];
sub.innerHTML = E[2].split(' · ').map((x, i, a) => `<span style="white-space:nowrap">${x}${i < a.length - 1 ? ' ·' : ''}</span>`).join(' ');
const cv = document.getElementById('c'); cv.width = W; cv.height = H; const g = cv.getContext('2d');
const HS = (a, b = 0) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0B1226'); sky.addColorStop(.55, '#2A2A4A'); sky.addColorStop(.75, '#6A4A5A'); g.fillStyle = sky; g.fillRect(0, 0, W, H);
const sx = W * (V ? .7 : .78), sy = H * (V ? .52 : .42), gr = g.createRadialGradient(sx, sy, 0, sx, sy, H * .5); gr.addColorStop(0, 'rgba(255,210,122,.75)'); gr.addColorStop(.15, 'rgba(255,170,110,.3)'); gr.addColorStop(1, 'rgba(255,170,110,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.fillStyle = '#FFE2A8'; g.beginPath(); g.arc(sx, sy, H * .045, 0, 7); g.fill();
const ridge = (x, s, amp, base) => base - amp * (.55 + .25 * Math.sin(x * .004 * 1920 / W + s) + .15 * Math.sin(x * .011 * 1920 / W + s * 2.1) + .07 * Math.sin(x * .031 + s * 3.7));
const L = [[1.2, .1, .58, '#2C3355'], [2.7, .13, .68, '#1E2A44'], [4.1, .15, .8, '#15233A'], [5.3, .12, .93, '#0E1828']];
L.forEach(([s, a, b, col], li) => { g.beginPath(); g.moveTo(0, H); for (let x = 0; x <= W; x += 6) g.lineTo(x, ridge(x, s, a * H, b * H)); g.lineTo(W, H); g.closePath(); g.fillStyle = col; g.fill();
  if (li === 0) { const cx = W * (V ? .62 : .7); for (let i = 0; i < 16; i++) { const x = cx + (i - 8) * H * .016, h = H * (.02 + HS(i, 3) * .05), y = ridge(x, s, a * H, b * H); g.fillStyle = '#3A4670'; g.fillRect(x, y - h, H * .013, h + 6); if (HS(i, 9) > .4) { g.fillStyle = '#FFD27A'; g.fillRect(x + 4, y - h + 8, 3, 3); } } }
  if (li >= 1) for (let i = 0; i < 90; i++) { const x = HS(i, li) * W, y = ridge(x, s, a * H, b * H) + 6, h = H * (.02 + li * .008); g.beginPath(); g.moveTo(x, y - h); g.lineTo(x - h * .35, y); g.lineTo(x + h * .35, y); g.closePath(); g.fillStyle = ['', '#1F4038', '#1A3832', '#15302B'][li]; g.fill(); } });
// 一条通往远城的路
g.strokeStyle = 'rgba(255,210,122,.6)'; g.lineWidth = 4; g.setLineDash([10, 14]); g.beginPath(); g.moveTo(W * .3, H); g.bezierCurveTo(W * .55, H * .85, W * .5, H * .72, W * (V ? .62 : .7), H * .58); g.stroke(); g.setLineDash([]);
for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255,255,255,${.2 + HS(i, 5) * .5})`; g.fillRect(HS(i, 1) * W, HS(i, 2) * H * .4, 2, 2); }
document.fonts.ready.then(() => window.ready = true);
</script></body></html>
