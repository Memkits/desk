name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.asset-path.outputs.prefix }}
      base-url: ${{ steps.asset-path.outputs.base-url }}
      artifact-name: site-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Select CDN asset path
      id: asset-path
      env:
        CDN_ORIGIN: https://cos-sh.tiye.me
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        elif [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
          asset_prefix="${GITHUB_REPOSITORY}/"
        else
          asset_prefix="${GITHUB_REPOSITORY}/branches/${GITHUB_REF_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        fi
        base_url="${CDN_ORIGIN}/${asset_prefix}"
        echo "ASSET_BASE=${base_url}" >> "$GITHUB_ENV"
        echo "prefix=${asset_prefix}" >> "$GITHUB_OUTPUT"
        echo "base-url=${base_url}" >> "$GITHUB_OUTPUT"

    - name: Build pages with CDN asset base
      run: |
        set -euo pipefail
        node scripts/build.mjs
        test -f dist/index.html
        # 每个 HTML 都必须带上 COS 资源前缀
        for f in $(find dist -name '*.html'); do grep -q "<base href=\"${ASSET_BASE}" "$f" || { echo "missing base in $f"; exit 1; }; done

    - name: Save built site
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: site-${{ github.run_id }}-${{ github.run_attempt }}
        path: dist
        if-no-files-found: error
        retention-days: 90

  upload:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: cos-upload-${{ github.repository }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
      queue: max
    steps:
    - name: Download built site
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ needs.build.outputs.artifact-name }}
        path: dist

    - name: Reject superseded deployment
      id: deploy-head
      env:
        GH_TOKEN: ${{ github.token }}
        DEPLOY_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        DEPLOY_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        branch_path=$(jq -rn --arg branch "$DEPLOY_BRANCH" '$branch | @uri')
        response=$(curl --silent --show-error \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          --write-out '\n%{http_code}' \
          "$GITHUB_API_URL/repos/$DEPLOY_REPOSITORY/git/ref/heads/$branch_path")
        http_code="${response##*$'\n'}"
        response_body="${response%$'\n'*}"
        if [[ "$http_code" == "404" ]]; then
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping deployment; branch no longer exists."
          exit 0
        fi
        if [[ "$http_code" != "200" ]]; then
          echo "::error::Cannot verify deployment branch HEAD (HTTP $http_code)."
          exit 1
        fi
        current_sha=$(printf '%s' "$response_body" | jq -er '.object.sha')
        if [[ "$current_sha" == "$EXPECTED_SHA" ]]; then
          echo "current=true" >> "$GITHUB_OUTPUT"
        else
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping superseded deployment; branch HEAD has changed."
        fi

    - name: Check COS credentials
      id: cos-credentials
      if: steps.deploy-head.outputs.current == 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        set -euo pipefail
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "::warning title=COS upload skipped::Configure COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY to run public upload verification."
          else
            echo "::error title=COS credentials missing::COS_BUCKET, COS_SECRET_ID, and COS_SECRET_KEY are required for production deployment."
            exit 1
          fi
        fi

    # COS：全部文件（HTML、图片、脚本、样式）
    - name: Upload and verify all files on COS
      if: steps.deploy-head.outputs.current == 'true' && steps.cos-credentials.outputs.available == 'true'
      uses: worktools/cos-upload-action@06d6027dcca6413c5936e04a9b6e9f0d5ef71ba0 # v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ needs.build.outputs.prefix }}
        public-base-url: ${{ needs.build.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    # tiye 服务器：只放 HTML 入口，其余资源都从 COS 加载
    - name: Collect HTML entries
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        set -euo pipefail
        mkdir -p html
        (cd dist && find . -name '*.html' -exec cp --parents {} ../html/ \;)
        find html -type f

    - name: Deploy HTML entries
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{ secrets.rsync_private_key }}
      with:
        flags: -avzr --progress
        options: ""
        ssh_options: ""
        src: html/*
        dest: rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}

    - name: Display deployment status
      if: steps.deploy-head.outputs.current == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"
